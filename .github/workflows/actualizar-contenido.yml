name: Actualizar Contenido Automático

on:
  schedule:
    # Lunes a las 11:00 AM hora de México (17:00 UTC)
    - cron: '0 17 * * 1'
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Crear service-account.json si existe el secreto
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT" > service-account.json
          fi

      - name: Ejecutar Agente de Recolección de Contenido
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node index.js

      - name: Hacer Commit y Push de los archivos JSON si hubo cambios
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: actualización automática de contenido [$(date +'%Y-%m-%d')]"
          file_pattern: "noticias.json alertas.json"
